# It regenerates assets/contrib-grid.svg from your real contribution calendar
# once a day and commits it back, so the README always shows current data.

name: Contribution grid

on:
  schedule:
    - cron: "23 4 * * *"      # 04:23 UTC daily
  workflow_dispatch:          # the Run workflow button, for testing
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the grid
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
          OUT: assets/contrib-grid.svg
        run: python contrib_grid.py

      - name: Commit it if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-grid.svg
          git diff --staged --quiet || git commit -m "Update contribution grid"
          git push
